<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Tracker</title>
</head>

<body>

    <h1>Student Grade Tracker</h1>

    <h2>Add Student</h2>

    <form id="addStudentForm">

        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" required>

        <br><br>

        <label for="studentId">Student ID:</label>
        <input type="text" id="studentId" required>

        <br><br>

        <label for="courseName">Course:</label>
        <input type="text" id="courseName" required>

        <br><br>

        <label for="grade">Grade:</label>
        <input type="number" id="grade" min="0" max="100" required>

        <br><br>

        <button type="submit">Add Student</button>

    </form>

    <h2>Statistics</h2>

    <p>Total Students: <strong id="totalStudents">0</strong></p>
    <p>Average Grade: <strong id="averageGrade">0%</strong></p>
    <p>Highest Grade: <strong id="highestGrade">0%</strong></p>
    <p>Lowest Grade: <strong id="lowestGrade">0%</strong></p>

    <h2>Search Students</h2>

    <label for="searchStudent">Search:</label>
    <input type="text" id="searchStudent" placeholder="Enter name or ID">

    <br><br>

    <label for="gradeFilter">Filter by Grade:</label>
    <select id="gradeFilter">
        <option value="all">All Grades</option>
        <option value="70">70% and above</option>
        <option value="60">60% - 69%</option>
        <option value="below60">Below 60%</option>
    </select>

    <h2>Student Records</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Course</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentTableBody">
            <tr>
                <td colspan="4">No students added yet</td>
            </tr>
        </tbody>
    </table>

    <h2>Export Data</h2>

        <button id="exportJson">Export JSON</button>

    <script src="app.js"></script>
</body>
</html>
